<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Videos — Auto Feed</title>
<meta name="description" content="Auto-updated videos feed scraped every 15 minutes." />
<meta name="referrer" content="no-referrer" />
<style>
  :root { color-scheme: dark; --bg:#0b0b0f; --card:#15151d; --muted:#8b8b99; --fg:#f2f2f7; --accent:#ff3b5c; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;background:rgba(11,11,15,.9);backdrop-filter:blur(10px);padding:12px 16px;border-bottom:1px solid #22222c;z-index:10}
  h1{margin:0 0 8px;font-size:18px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,select{background:#1e1e28;border:1px solid #2a2a36;color:var(--fg);padding:8px 10px;border-radius:8px;font:inherit}
  input{flex:1;min-width:180px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:thin}
  .chip{white-space:nowrap;background:#1e1e28;border:1px solid #2a2a36;color:var(--fg);padding:5px 10px;border-radius:999px;font-size:12px;cursor:pointer}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  main{padding:16px;max-width:1400px;margin:0 auto}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s}
  .card:hover{transform:translateY(-2px)}
  .thumb{aspect-ratio:16/9;background:#22222c;background-size:cover;background-position:center}
  .meta{padding:10px 12px}
  .title{font-weight:600;font-size:14px;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .desc{color:var(--muted);font-size:12px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .tag{font-size:10px;padding:2px 6px;background:#22222c;border-radius:4px;color:var(--muted)}
  .empty,.loading{text-align:center;padding:40px;color:var(--muted)}
  .player{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;flex-direction:column;gap:12px}
  .player.open{display:flex}
  .player video{max-width:100%;max-height:85vh;background:#000;border-radius:8px}
  .player .ptitle{color:#fff;font-size:16px;max-width:900px;text-align:center}
  .close{position:absolute;top:14px;right:16px;background:#fff2;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
  footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>🎬 Videos Feed <span id="count" style="color:var(--muted);font-weight:400;font-size:13px"></span></h1>
  <div class="bar">
    <input id="q" placeholder="Search title / description…" />
    <select id="sort"><option value="date">Newest</option><option value="title">A–Z</option></select>
  </div>
  <div id="chips" class="chips"></div>
</header>
<main>
  <div id="status" class="loading">Loading…</div>
  <div id="grid" class="grid"></div>
</main>
<div id="player" class="player">
  <button class="close" onclick="closePlayer()">×</button>
  <video id="video" controls playsinline referrerpolicy="no-referrer"></video>
  <div id="ptitle" class="ptitle"></div>
</div>
<footer>Auto-updated every 15 min · <a href="./data.json" style="color:var(--muted)">data.json</a></footer>

<script>
const DATA_URL = "./data.json";
let items = [], folders = [], activeFolder = "", query = "", sortBy = "date";

async function load(){
  try{
    const r = await fetch(DATA_URL + "?t=" + Date.now());
    const j = await r.json();
    items = j.items || [];
    folders = Object.entries(j.folders || {}).sort((a,b)=>b[1]-a[1]);
    document.getElementById("count").textContent = `(${items.length})`;
    renderChips(); render();
  }catch(e){
    document.getElementById("status").textContent = "Failed to load data.json — " + e.message;
  }
}
function renderChips(){
  const el = document.getElementById("chips");
  el.innerHTML = `<button class="chip ${!activeFolder?'active':''}" data-f="">All</button>` +
    folders.slice(0,60).map(([f,c])=>`<button class="chip ${activeFolder===f?'active':''}" data-f="${f}">${f} (${c})</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{activeFolder=b.dataset.f;renderChips();render();});
}
function render(){
  const g = document.getElementById("grid");
  const s = document.getElementById("status");
  let list = items.filter(it=>{
    if(activeFolder && !(it.folders||[]).includes(activeFolder)) return false;
    if(query){ const q=query.toLowerCase(); return (it.title||"").toLowerCase().includes(q)||(it.description||"").toLowerCase().includes(q);}
    return true;
  });
  if(sortBy==="title") list.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  else list.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  s.style.display = list.length?"none":"block";
  s.textContent = list.length?"":"No videos found.";
  g.innerHTML = list.map(it=>`
    <div class="card" data-src="${encodeURIComponent(it.video_src||'')}" data-title="${encodeURIComponent(it.title||'')}" data-link="${it.link||''}">
      <div class="thumb" style="background-image:url('${it.thumbnail||''}')"></div>
      <div class="meta">
        <p class="title">${escapeHtml(it.title||'Untitled')}</p>
        <p class="desc">${escapeHtml(it.description||'')}</p>
        <div class="tags">${(it.folders||[]).slice(0,3).map(f=>`<span class="tag">${escapeHtml(f)}</span>`).join("")}</div>
      </div>
    </div>`).join("");
  g.querySelectorAll(".card").forEach(c=>c.onclick=()=>{
    const src=decodeURIComponent(c.dataset.src), title=decodeURIComponent(c.dataset.title);
    if(src) openPlayer(src,title); else window.open(c.dataset.link,"_blank");
  });
}
function openPlayer(src,title){
  const p=document.getElementById("player"), v=document.getElementById("video");
  v.src=src; document.getElementById("ptitle").textContent=title; p.classList.add("open");
}
function closePlayer(){const p=document.getElementById("player"),v=document.getElementById("video");v.pause();v.removeAttribute("src");v.load();p.classList.remove("open");}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
document.getElementById("q").oninput=e=>{query=e.target.value;render();};
document.getElementById("sort").onchange=e=>{sortBy=e.target.value;render();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePlayer();});
load(); setInterval(load, 15*60*1000);
</script>
</body>
</html>
