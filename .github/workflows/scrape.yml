name: Auto Scraper (zmaal.net)

on:
  schedule:
    # every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/scraper.py"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        run: python scripts/scraper.py

      - name: Sync data.json to docs/ (GitHub Pages)
        run: |
          mkdir -p docs
          cp public/data.json docs/data.json

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json docs/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): auto update $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push

